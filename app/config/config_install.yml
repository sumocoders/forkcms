imports:
    - { resource: console.yml }
    - { resource: form.yml }
    - { resource: parameters_install.yml }
    - { resource: doctrine.yml }

framework:
    secret: "%kernel.secret%"
    router:
        resource: "%kernel.project_dir%/app/config/routing_install.yml"
        strict_requirements: ~
    form: ~
    csrf_protection: ~
    session:
        handler_id: ~
    validation:
        enabled: true
    cache:
        app: cache.adapter.filesystem
        pools:
            cache.search:
                adapter: cache.app
                public: true
                default_lifetime: 3600

# Assetic Configuration
#assetic:
#    debug: "%kernel.debug%"
#    use_controller: false
#    bundles: [ 'ForkCMSInstallerBundle' ]
#    filters:
#        cssrewrite: ~

monolog:
    handlers:
        main:
            type: stream
            path: "%site.path_www%/var/logs/%kernel.environment%/debug.log"
            level: debug

parameters:
    fork.is_installed: false
    fork.form.theme: "Installer/form_theme.html.twig"

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # doctrine-bundle 3 removed the doctrine.dbal.connection_factory.class parameter,
    # so the install-time factory has to decorate the service instead
    ForkCMS\Bundle\InstallerBundle\Service\InstallerConnectionFactory:
        decorates: doctrine.dbal.connection_factory
        arguments:
            - "@.inner"

    fork.settings:
        class: Common\ModulesSettings
        public: true
        arguments:
            - "@database"
            - "@cache.pool"
            - "%fork.is_installed%"

    # the MediaLibrary installer fetches the bus from the container (config.yml isn't loaded here)
    Symfony\Component\Messenger\MessageBusInterface:
        alias: messenger.bus.default
        public: true

    # dummy service during the installation
    mailer_configurator:
        class: stdClass

    cache.pool:
        class: Symfony\Component\Cache\Adapter\ArrayAdapter

    database:
        class: SpoonDatabase
        public: true
        arguments:
            - "%database.driver%"
            - "%database.host%"
            - "%database.user%"
            - "%database.password%"
            - "%database.name%"
            - "%database.port%"
        calls:
            - [ setDebug, [ "%kernel.debug%" ]]
    SpoonDatabase: '@database'

    ForkCMS\Utility\Thumbnails:
        public: true
        arguments:
            - "%site.path_www%"

    Common\Mailer\EmailFactory:
        public: true
        arguments:
            - "@fork.settings"
